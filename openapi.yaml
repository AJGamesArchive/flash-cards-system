openapi: 3.0.0
info:
  title: TestVar - Flashcards API
  description: "A revolutionary REST API for flashcards"
  version: 1.0.0
servers:
  - url: http://localhost:80
    description: Development server
  - url: http://testvar.difcsi.hu
    description: Reference server
paths:
  /:
    get:
      summary: "Return the active API version"
      tags:
        - "Completed - General"
      responses:
        "200":
          description: "The active API version"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  version:
                    type: "string"
                    example: "1.0.0"
  /login:
    post:
      summary: "Validates a users username and password and returns a JWT"
      tags:
        - "Completed - Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
      responses:
        "200":
          description: "A JSON Web Token"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
        "401":
          description: "Invalid login credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Failed to generate login token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /confirmLogin:
    get:
      summary: "Confirm a user is logged in by validating their JWT"
      tags:
        - "Completed - Authentication"
      responses:
        "200":
          description: "Valid login session - returns user JWT payload"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  loggedIn:
                    type: "boolean"
                  user:
                    type: "object"
                    properties:
                      username:
                        type: "string"
                      uuid:
                        type: "string"
                      isAdmin:
                        type: "boolean"
        "401":
          description: "Invalid login session"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  loggedIn:
                    type: "boolean"
  /logout:
    delete:
      summary: "Logout a user by removing their JWT from the DB"
      tags:
        - "Completed - Authentication"
      responses:
        "202":
          description: "Starting Logout Process"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets:
    get:
      summary: "Get all flashcard sets"
      tags:
        - "Completed - FlashCard Sets"
      responses:
        "200":
          description: "A list of flashcard sets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    setUUID:
                      type: "string"
                    name:
                      type: "string"
                    description:
                      type: "string"
                    createdAt:
                      type: "string"
                      format: "date-time"
                    updatedAt:
                      type: "string"
                      format: "date-time"
                    authorUUID:
                      type: "string"
                    authorUsername:
                      type: "string"
                    numReviews:
                      type: "number"
                    numFlashcards:
                      type: "number"
    post:
      summary: "Create a new flashcard set with flashcards"
      description: "There can only be 20 new flashcard sets created per day"
      tags:
        - "Completed - FlashCard Sets"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                setDetails:
                  type: "object"
                  properties:
                    name:
                      type: "string"
                    description:
                      type: "string"
                    authorUUID:
                      type: "string"
                flashCards:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      question:
                        type: "string"
                      answer:
                        type: "string"
                      difficulty:
                        $ref: "#/components/schemas/Difficulty"
      responses:
        "201":
          description: "The created flashcard set"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  setDetails:
                    type: "object"
                    $ref: "#/components/schemas/FlashcardSet"
                  flashCards:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/FlashCard"
        "400":
          description: "Missing Flashcards"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "You have reached the maximum number of flashcard sets allowed today"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
    get:
      summary: "Get a flashcard set by UUID"
      tags:
        - "Completed - FlashCard Sets"
      responses:
        "200":
          description: "The flashcard set"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  setUUID:
                    type: "string"
                  name:
                    type: "string"
                  description:
                    type: "string"
                  createdAt:
                    type: "string"
                    format: "date-time"
                  updatedAt:
                    type: "string"
                    format: "date-time"
                  authorUUID:
                    type: "string"
                  authorUsername:
                    type: "string"
                  numReviews:
                    type: "number"
                  numFlashcards:
                    type: "number"
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: "Update a flashcard set by ID"
      tags:
        - "Completed - FlashCard Sets"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                setDetails:
                  type: "object"
                  $ref: "#/components/schemas/FlashcardSet"
                flashCards:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/FlashCard"
      responses:
        "200":
          description: "The updated flashcard set"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  setDetails:
                    type: "object"
                    $ref: "#/components/schemas/FlashcardSet"
                  flashCards:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/FlashCard"
        "400":
          description: "Missing Flashcards"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The flashcard set does not belong to you"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Delete a flashcard set and it's flashcards by ID"
      tags:
        - "Completed - FlashCard Sets"
      responses:
        "204":
          description: "The flashcard set was deleted"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The flashcard set does not belong to you"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}/review:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
    post:
      summary: "Review a flashcard set, by the current user"
      tags:
        - "Completed - FlashCard Set Reviews"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                review:
                  type: "string"
                starRating:
                  type: "number"
      responses:
        "201":
          description: "The created review"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetReview"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}/reviews:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
    get:
      summary: "Get all reviews for a flashcard set"
      tags:
        - "Completed - FlashCard Set Reviews"
      responses:
        "200":
          description: "Set Reviews Fetched"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    reviewUUID:
                      type: "string"
                    review:
                      type: "string"
                    starRating:
                      type: "number"
                    reviewDate:
                      type: "string"
                      format: "date-time"
                    updatedAt:
                      type: "string"
                      format: "date-time"
                    authorUUID:
                      type: "string"
                    authorUsername:
                      type: "string"
                    setUUID:
                      type: "string"
        "404":
          description: "No reviews were found for that set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}/reviews/{reviewUUID}:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
      - name: reviewUUID
        in: path
        required: true
        description: The UUID of a specific review to fetch
        schema:
          type: "string"
    get:
      summary: "Get a set review by review UUID"
      tags:
        - "Completed - FlashCard Set Reviews"
      responses:
        "200":
          description: "Set Review Fetched"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  reviewUUID:
                    type: "string"
                  review:
                    type: "string"
                  starRating:
                    type: "number"
                  reviewDate:
                    type: "string"
                    format: "date-time"
                  updatedAt:
                    type: "string"
                    format: "date-time"
                  authorUUID:
                    type: "string"
                  authorUsername:
                    type: "string"
                  setUUID:
                    type: "string"
        "404":
          description: "Set Review Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}/reviews/authors/{authorUUID}:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
      - name: authorUUID
        in: path
        required: true
        description: "UUID of author to fetch reviews for"
        schema:
          type: "string"
    get:
      summary: "Get all reviews for a given author"
      tags:
        - "Completed - FlashCard Set Reviews"
      responses:
        "200":
          description: "Author Reviews Fetched"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    reviewUUID:
                      type: "string"
                    review:
                      type: "string"
                    starRating:
                      type: "number"
                    reviewDate:
                      type: "string"
                      format: "date-time"
                    updatedAt:
                      type: "string"
                      format: "date-time"
                    authorUUID:
                      type: "string"
                    authorUsername:
                      type: "string"
                    setUUID:
                      type: "string"
        "404":
          description: "No reviews were found for that author"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sets/{setUUID}/cards:
    parameters:
      - name: setUUID
        in: path
        required: true
        description: "The UUID of the flashcard set"
        schema:
          type: "string"
    get:
      summary: "Get all flashcards in a set"
      tags:
        - "Completed - FlashCard Sets"
      parameters:
        - name: shuffle
          in: query
          required: false
          description: "Get the flashcards in a random order"
          schema:
            type: "boolean"
      responses:
        "200":
          description: "A list of flashcards"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/FlashCard"
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users:
    get:
      summary: "Get all users"
      tags:
        - "Completed - Users"
      responses:
        "200":
          description: "A list of users"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "User not admin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Create a new user"
      tags:
        - "Completed - Users"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
                  format: "password"
                  example: "password"
                adminFlag:
                  type: "boolean"
                apiAccount:
                  type: "boolean"
      responses:
        "201":
          description: "The created user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: "Missing required details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "You cannot create an admin user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{userUUID}:
    parameters:
      - name: userUUID
        in: path
        required: true
        description: "The UUID of the user"
        schema:
          type: "string"
    get:
      summary: "Get a user by UUID"
      tags:
        - "Completed - Users"
      responses:
        "200":
          description: "The user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The user was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: "Update a users username and rank by UUID"
      tags:
        - "Completed - Users"
      description: "Admin status only editable if the current user is an admin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:     
                username:
                  type: "string"
                adminFlag:
                  type: "boolean"
      responses:
        "200":
          description: "The updated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Cannot change users rank"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The user was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Delete a user by ID"
      tags:
        - "Completed - Users"
      responses:
        "204":
          description: "The user was deleted"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Cannot delete that user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The user was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{userUUID}/password:
    patch:
      summary: "Update a users password by UUID"
      tags:
        - Completed - Users
      parameters:
        - name: userUUID
          in: path
          required: true
          description: UUID of user to update password for
          schema:
            type: "string"
      responses:
        "204":
          description: "Password updated"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Cannot update passwords for other users"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{userUUID}/sets:
    get:
      summary: "Get all flashcard sets created by a user"
      tags:
        - "Completed - Users"
        - "Completed - FlashCard Sets"
      parameters:
        - name: userUUID
          in: path
          required: true
          description: "The UUID of the user"
          schema:
            type: "string"
      responses:
        "200":
          description: "A list of flashcard sets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    setUUID:
                      type: "string"
                    name:
                      type: "string"
                    description:
                      type: "string"
                    createdAt:
                      type: "string"
                      format: "date-time"
                    updatedAt:
                      type: "string"
                      format: "date-time"
                    authorUUID:
                      type: "string"
                    authorUsername:
                      type: "string"
                    numReviews:
                      type: "number"
                    numFlashcards:
                      type: "number"
        "404":
          description: "The user was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /flashcards/{cardUUID}/log:
    post:
      summary: "Create a flashcard usage log entry"
      tags:
        - "Completed - Flashcard Logs"
      parameters:
        - name: cardUUID
          in: path
          required: true
          description: UUID of flashcard the log is for
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                faceDownTime:
                  type: "string"
                revisionTime:
                  type: "string"
                timesFlipped:
                  type: "string"
      responses:
        "201":
          description: "The created log entry"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  logUUID:
                    type: "string"
                  faceDownTime:
                    type: "string"
                  revisionTime:
                    type: "string"
                  timesFlipped:
                    type: "string"
                  cardUUID:
                    type: "string"
        "401":
          description: "User not logged in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Flashcard not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hiddenCards/{userUUID}:
    parameters:
      - name: userUUID
        in: path
        required: true
        description: UUID of user to fetch hidden cards for
        schema:
          type: "string"
    get:
      summary: "Get UUIDs for all cards hidden from a given user"
      tags:
        - "Completed - Hidden Card Allocations"
      responses:
        "200":
          description: "List of hidden flashcard UUIDs"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "string"
    post:
      summary: "Create a hidden card allocation for a user"
      tags:
        - Completed - Hidden Card Allocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                cardUUID:
                  type: "string"
      responses:
        "201":
          description: "The create allocation entry"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  userUUID:
                    type: "string"
                  cardUUID:
                    type: "string"
        "401":
          description: "User Not Logged In"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Cannot create allocations for another user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User or Flashcard Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Delete a hidden card allocation from a user"
      tags:
        - Completed - Hidden Card Allocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                cardUUID:
                  type: "string"
      responses:
        "204":
          description: "Allocation deleted successfully"
        "401":
          description: "User Not Logged In"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Cannot delete allocations for another user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User or Flashcard Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Something went wrong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{userID}/collections:
    get:
      summary: "Get all flashcard set collections created by a user"
      tags:
        - "Collections"
      responses:
        "200":
          description: "A list of flashcard set collections"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    comment:
                      type: "string"  
                      description: "The user's comment on the set"
                    set:
                      $ref: "#/components/schemas/FlashcardSet"
  /users/{userID}/collections/{collectionID}:
    parameters:
      - name: userID
        in: path
        required: true
        description: "The ID of the user"
        schema:
          type: "string"
      - name: collectionID
        in: path
        required: true
        description: "The ID of the collection"
        schema:
          type: "string"
    get:
      summary: "Get a flashcard set collection by ID"
      tags:
        - "Collections"
      responses:
        "200":
          description: "The flashcard set collection"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  comment:
                    type: "string"  
                    description: "The user's comment on the set"
                  set:
                    $ref: "#/components/schemas/FlashcardSet"
                  user:
                    $ref: "#/components/schemas/User"  
        "404":
          description: "The flashcard set collection was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: "Update a flashcard set collection by ID"
      tags:
        - "Collections"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                comment:
                  type: "string"
                  example: "I love this set!"
      responses:
        "200":
          description: "The updated flashcard set collection"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  comment:
                    type: "string"  
                    description: "The user's comment on the set"
                  set:
                    $ref: "#/components/schemas/FlashcardSet"
                  user:
                    $ref: "#/components/schemas/User"  
        "404":
          description: "The flashcard set collection was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "You are not authorized ('logged in') to update this collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "You are not allowed to update this collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Delete a flashcard set collection by ID"
      tags:
        - "Collections"
      responses:
        "204":
          description: "The flashcard set collection was deleted"
        "404":
          description: "The flashcard set collection was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "You are not authorized ('logged in') to delete this collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '403':
          description: "You are not allowed to delete this collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /collections:
    get:
      summary: "Get all flashcard set collections"
      tags:
        - "Collections"
      responses:
        "200":
          description: "A list of flashcard set collections"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    comment:
                      type: "string"  
                      description: "The user's comment on the set"
                    set:
                      $ref: "#/components/schemas/FlashcardSet"
                    User:
                      $ref: "#/components/schemas/User"  
    post:
      summary: "Create a new flashcard set collection"
      tags:
        - "Collections"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "array"
              items:
                type: "object"
                properties:
                  comment:
                    type: "string"
                    example: "I love this set!"
                  setID:
                    type: "number"
                    example: 1

      responses:
        "201":
          description: "The created flashcard set collection"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  comment:
                    type: "string"  
                    description: "The user's comment on the set"
                  set:
                    $ref: "#/components/schemas/FlashcardSet"
                  user:
                    $ref: "#/components/schemas/User"  
        "404":
          description: "The flashcard set was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /collections/random:
    get:
      summary: "Redirect to a random flashcard set collection"
      tags:
        - "Collections"
      responses:
        "302":
          description: "Redirect to a random flashcard set collection"
          headers:
            Location:
              schema:
                type: "string"
                example: "/users/1/collections/1"
        "404":
          description: "There are no flashcard set collections"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                  

components:
  schemas:
    FlashCard:
      type: "object"
      properties:
        cardUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        question:
          type: "string"
          example: "What is the capital of France?"
        answer:
          type: "string"
          example: "Paris"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        createdAt:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        updatedAt:
          type: "string"
          format: "date-time"
          example: "2024-10-15T12:00:00Z"
        setUUID:
          type: "string"
          format: "string"
          example: "00000000-0000-0000-0000-000000000000"
    FlashcardSet:
      type: "object"
      properties:
        setUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        name:
          type: "string"
          example: "European Capitals"
        description:
          type: "string"
          example: "Capital cities of European countries."
        createdAt:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        updatedAt:
          type: "string"
          format: "date-time"
          example: "2024-10-15T12:00:00Z"
        authorUUID:
          type: "string"
          format: "string"
          example: "00000000-0000-0000-0000-000000000000"
    Error:
      type: "object"
      properties:
        message:
          type: "string"
          nullable: false
    Difficulty:
      type: "string"
      enum:
        - "easy"
        - "medium"
        - "hard"
    User:
      type: "object"
      properties:
        userUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        username:
          type: "string"
          example: "johndoe"
        adminFlag:
          type: "boolean"
          example: false
          default: false
          description: "The set creation limit should only apply to non-admin users"
        userSince:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        delete:
          type: "boolean"
          default: false
          example: false
        apiAccount:
          type: "boolean"
          default: false
          example: false
    Collection:
      type: "object"
      properties:
        collectionUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        name:
          type: "string"
          example: "French Beginner Sets"
        description:
          type: "string"
          example: "Sets to help beginners start to learn French"
        createdOn:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        updatedOn:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        authorUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
    SetReview:
      type: "object"
      properties:
        reviewUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        review:
          type: "string"
          example: "This set of flashcards is great!"
        starRating:
          type: "number"
          example: "5"
        reviewDate:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        updatedAt:
          type: "string"
          format: "date-time"
          example: "2024-10-14T12:00:00Z"
        authorUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        setUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
    FlashcardUsageLogs:
      type: "object"
      properties:
        logUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        cardUUID:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        faceDownTime:
          type: "number"
          description: "Log of duration in seconds"
        revisionTime:
          type: "number"
          description: "Log of duration in seconds"
        timesFlipped:
          type: "number"
          description: "Log of duration in seconds"
